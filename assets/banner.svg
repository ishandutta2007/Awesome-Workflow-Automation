<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7928CA;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" rx="15" />
  <text x="50%" y="50%" font-size="40" font-weight="bold" fill="white" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">Awesome Workflow Automation 🚀</text>
  <circle cx="100" cy="100" r="10" fill="white">
    <animate attributeName="r" values="10;20;10" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="100" r="10" fill="white">
    <animate attributeName="r" values="10;20;10" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
